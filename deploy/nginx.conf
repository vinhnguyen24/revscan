# TrapKey — nginx in front of web/server.js
#
# TLS is terminated here (certbot) or upstream (Cloudflare). The app never
# speaks TLS itself. Uploads are bounded here as well as in the app.

upstream trapkey_web {
    server 127.0.0.1:7200;
    keepalive 16;
}

server {
    listen 80;
    server_name trapkey.dev www.trapkey.dev;
    return 301 https://trapkey.dev$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trapkey.dev;

    ssl_certificate     /etc/letsencrypt/live/trapkey.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trapkey.dev/privkey.pem;

    client_max_body_size 160m;   # app enforces 150MB; nginx is the outer guard
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Static assets are cheap and immutable per deploy.
    location /static/ {
        proxy_pass http://trapkey_web;
        proxy_set_header Host $host;
        expires 1h;
    }

    # Scans are slow; do not let nginx time out before the engine does.
    location /api/scan {
        proxy_pass http://trapkey_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts X-Real-IP (not the first X-Forwarded-For entry); nginx
        # overwrites it with the peer address, so a client cannot spoof it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://trapkey_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
