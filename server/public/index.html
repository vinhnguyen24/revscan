<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrapKey — Admin</title>
<style>
  :root {
    --bg: #0b0d11; --panel: #121620; --line: #232a38; --ink: #e8ecf4;
    --muted: #8b97ad; --brand: #ff4d6d; --ok: #3ddc97; --warn: #f5a524;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #0b0d11ee;
           backdrop-filter: blur(8px); z-index: 5; }
  .logo { font-weight: 700; letter-spacing: .5px; }
  .logo span { color: var(--brand); }
  .spacer { flex: 1; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  h2 { margin: 0 0 4px; font-size: 15px; }
  p.hint { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  input, button, select { font: inherit; }
  input, select { background: #0e1219; border: 1px solid var(--line); color: var(--ink);
                  border-radius: 9px; padding: 9px 11px; min-width: 140px; }
  input:focus, select:focus { outline: 2px solid #ff4d6d55; border-color: var(--brand); }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 9px;
           padding: 9px 14px; cursor: pointer; font-weight: 600; }
  button.ghost { background: #1a2030; color: var(--ink); border: 1px solid var(--line); }
  button.small { padding: 5px 9px; font-size: 12px; font-weight: 500; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px;
         background: #0e1219; border: 1px solid var(--line); border-radius: 6px;
         padding: 2px 6px; word-break: break-all; }
  pre { margin: 10px 0 0; background: #0e1219; border: 1px solid var(--line);
        border-radius: 10px; padding: 12px; overflow: auto; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.active { background: #3ddc9722; color: var(--ok); }
  .pill.revoked { background: #ff4d6d22; color: var(--brand); }
  .pill.expired { background: #f5a52422; color: var(--warn); }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  #toast { position: fixed; right: 20px; bottom: 20px; background: #1a2030; border: 1px solid var(--line);
           border-left: 3px solid var(--ok); padding: 10px 14px; border-radius: 10px; opacity: 0;
           transform: translateY(8px); transition: .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { border-left-color: var(--brand); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="logo">Trap<span>Key</span></div>
  <div class="muted" id="keyState">chưa có admin key</div>
  <div class="spacer"></div>
  <input id="adminKey" type="password" placeholder="admin key" style="width:260px" />
  <button class="ghost" onclick="saveKey()">Lưu</button>
</header>

<main>
  <section class="card">
    <h2>1. Sản phẩm</h2>
    <p class="hint">Tạo product → copy <code>verifyKey</code> (n / e) để nhúng vào app của khách.</p>
    <div class="row">
      <label>Tên sản phẩm<input id="pName" placeholder="MyApp Desktop" /></label>
      <label>Token TTL (ngày)<input id="pTtl" type="number" value="7" min="1" max="30" /></label>
      <button onclick="createProduct()">Tạo product</button>
    </div>
    <div id="products"></div>
  </section>

  <section class="card">
    <h2>2. Keys</h2>
    <p class="hint">Key <code>TK-XXXXX-XXXXX-XXXXX-XXXXX</code> · HWID bind · có thể revoke bất cứ lúc nào.</p>
    <div class="row">
      <label>Product<select id="keyProduct"></select></label>
      <label>Số lượng<input id="keyCount" type="number" value="1" min="1" max="500" /></label>
      <label>Hạn (ngày)<input id="keyDays" type="number" value="365" min="1" /></label>
      <label>Seats<input id="keySeats" type="number" value="1" min="1" max="50" /></label>
      <label>Features<input id="keyFeatures" placeholder="pro,beta" /></label>
      <button onclick="createKeys()">Phát key</button>
    </div>
    <div id="keys"></div>
  </section>

  <section class="card">
    <h2>3. Activations</h2>
    <p class="hint">Mỗi máy kích hoạt = 1 HWID hash. Revoke key để giải phóng seat.</p>
    <div id="acts"></div>
  </section>
</main>

<div id="toast"></div>

<script>
const LS = 'trapkey_admin_key';
let products = [];

function key() { return document.getElementById('adminKey').value.trim(); }

function saveKey() {
  localStorage.setItem(LS, key());
  document.getElementById('keyState').textContent = 'đã lưu key';
  toast('Đã lưu admin key');
  refreshAll();
}

function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.className = ''), 2400);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'content-type': 'application/json',
      'x-admin-key': key(),
      ...(opts.headers || {}),
    },
  });
  let payload = null;
  try { payload = await res.json(); } catch {}
  if (!res.ok || (payload && payload.ok === false)) {
    const msg = payload?.error?.code || res.status;
    throw new Error(msg);
  }
  return payload.data;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function createProduct() {
  try {
    const name = document.getElementById('pName').value.trim();
    if (!name) return toast('Nhập tên sản phẩm', true);
    const ttl = Number(document.getElementById('pTtl').value) || 7;
    await api('/v1/products', { method: 'POST', body: JSON.stringify({ name, tokenTtlDays: ttl }) });
    document.getElementById('pName').value = '';
    toast('Đã tạo product');
    await refreshProducts();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function createKeys() {
  try {
    const productId = document.getElementById('keyProduct').value;
    if (!productId) return toast('Chưa có product', true);
    const body = {
      productId,
      count: Number(document.getElementById('keyCount').value) || 1,
      days: Number(document.getElementById('keyDays').value) || 365,
      seats: Number(document.getElementById('keySeats').value) || 1,
      features: document.getElementById('keyFeatures').value.split(',').map(s => s.trim()).filter(Boolean),
    };
    const data = await api('/v1/keys', { method: 'POST', body: JSON.stringify(body) });
    toast(`Đã phát ${data.created.length} key`);
    document.getElementById('keys').insertAdjacentHTML('afterbegin',
      `<pre>${esc(data.created.join('\n'))}</pre>`);
    await refreshKeys();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function revoke(k) {
  const reason = prompt('Lý do revoke?', 'refund');
  if (reason === null) return;
  try {
    await api(`/v1/keys/${encodeURIComponent(k)}/revoke`, {
      method: 'POST', body: JSON.stringify({ reason }),
    });
    toast('Đã revoke');
    await refreshKeys();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function extend(k) {
  const days = prompt('Cộng thêm bao nhiêu ngày?', '30');
  if (!days) return;
  try {
    await api(`/v1/keys/${encodeURIComponent(k)}/extend`, {
      method: 'POST', body: JSON.stringify({ days: Number(days) }),
    });
    toast('Đã gia hạn');
    await refreshKeys();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

function renderProducts() {
  const el = document.getElementById('products');
  const sel = document.getElementById('keyProduct');
  if (!products.length) {
    el.innerHTML = '<div class="empty">Chưa có product nào.</div>';
    sel.innerHTML = '';
    return;
  }
  el.innerHTML = products.map((p) => `
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <div><strong>${esc(p.name)}</strong> <code>${esc(p.id)}</code>
        <span class="muted">· TTL ${p.tokenTtlDays}d</span></div>
      <div class="muted" style="font-size:12px;margin:6px 0 4px">Nhúng vào app:</div>
      <pre>n = ${esc(p.verifyKey.n)}
e = ${esc(p.verifyKey.e)}</pre>
    </div>`).join('');
  sel.innerHTML = products.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
}

function renderKeys(rows) {
  const el = document.getElementById('keys');
  if (!rows.length) { el.innerHTML = '<div class="empty">Chưa có key nào.</div>'; return; }
  el.innerHTML = `<table><thead><tr>
      <th>Key</th><th>Trạng thái</th><th>Hết hạn</th><th>Seats</th><th></th>
    </tr></thead><tbody>${rows.map((k) => `
      <tr>
        <td><code>${esc(k.key)}</code>${k.note ? `<div class="muted">${esc(k.note)}</div>` : ''}</td>
        <td><span class="pill ${k.status}">${k.status}</span></td>
        <td class="muted">${k.expiresAt ? new Date(k.expiresAt).toLocaleDateString('vi-VN') : '—'}</td>
        <td>${k.seats}</td>
        <td style="white-space:nowrap">
          <button class="small ghost" onclick="extend('${esc(k.key)}')">+ngày</button>
          <button class="small ghost" onclick="revoke('${esc(k.key)}')" ${k.status === 'revoked' ? 'disabled' : ''}>revoke</button>
        </td>
      </tr>`).join('')}</tbody></table>`;
}

function renderActs(rows) {
  const el = document.getElementById('acts');
  if (!rows.length) { el.innerHTML = '<div class="empty">Chưa có máy nào kích hoạt.</div>'; return; }
  el.innerHTML = `<table><thead><tr>
      <th>Key</th><th>HWID</th><th>Kích hoạt</th><th>Seen</th><th>Trạng thái</th>
    </tr></thead><tbody>${rows.map((a) => `
      <tr>
        <td><code>${esc(a.key)}</code></td>
        <td><code>${esc(a.hwid)}</code></td>
        <td class="muted">${new Date(a.createdAt).toLocaleString('vi-VN')}</td>
        <td class="muted">${a.lastSeenAt ? new Date(a.lastSeenAt).toLocaleString('vi-VN') : '—'}</td>
        <td><span class="pill ${esc(a.status)}">${esc(a.status)}</span></td>
      </tr>`).join('')}</tbody></table>`;
}

async function refreshProducts() {
  products = await api('/v1/products');
  renderProducts();
  await refreshKeys();
}

async function refreshKeys() {
  const rows = await api('/v1/keys?limit=50');
  renderKeys(rows);
  const acts = await api('/v1/activations');
  renderActs(acts);
}

async function refreshAll() {
  if (!key()) return;
  try { await refreshProducts(); } catch (e) { toast('Lỗi: ' + e.message, true); }
}

document.getElementById('adminKey').value = localStorage.getItem(LS) || '';
document.getElementById('keyState').textContent = localStorage.getItem(LS) ? 'key đã lưu' : 'chưa có admin key';
if (localStorage.getItem(LS)) refreshAll();
</script>
</body>
</html>
